<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>💖 Gửi Hải Linh - Từ Trái Tim Anh 💖</title>
    <meta name="description" content="Một thông điệp đặc biệt dành riêng cho Hải Linh từ trái tim anh.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        /* ========== RESET & BASE ========== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: #0a0a1a;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* ========== COSMIC BACKGROUND ========== */
        .cosmic-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at 20% 50%, #1a0533 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 20%, #0d1b3e 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 80%, #2a0a2e 0%, transparent 50%),
                        #06060f;
            overflow: hidden;
        }

        .cosmic-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 40%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                        radial-gradient(circle at 70% 60%, rgba(236, 72, 153, 0.08) 0%, transparent 60%);
            animation: nebulaPulse 8s ease-in-out infinite alternate;
        }

        @keyframes nebulaPulse {
            0%   { opacity: 0.5; transform: scale(1); }
            100% { opacity: 1;   transform: scale(1.05); }
        }

        /* ========== STARS ========== */
        .stars-container {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            animation: twinkle var(--dur) ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0%   { opacity: var(--o1); transform: scale(1); }
            100% { opacity: var(--o2); transform: scale(1.5); }
        }

        /* Shooting star */
        .shooting-star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.6);
            animation: shoot 3s linear infinite;
            opacity: 0;
        }

        .shooting-star::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 100%;
            width: 80px;
            height: 1.5px;
            background: linear-gradient(to left, rgba(255,255,255,0.8), transparent);
            transform: translateY(-50%);
        }

        @keyframes shoot {
            0%   { transform: translate(0, 0) rotate(-35deg); opacity: 0; }
            5%   { opacity: 1; }
            15%  { opacity: 1; }
            20%  { transform: translate(400px, 200px) rotate(-35deg); opacity: 0; }
            100% { opacity: 0; }
        }

        /* ========== PETAL / PARTICLES ========== */
        .petals-container {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            top: -30px;
            opacity: 0;
            animation: petalFall var(--fall-dur) linear infinite;
            animation-delay: var(--delay);
        }

        @keyframes petalFall {
            0% {
                opacity: 0;
                transform: translateX(0) translateY(0) rotate(0deg) scale(var(--sc));
            }
            10% { opacity: 0.9; }
            90% { opacity: 0.7; }
            100% {
                opacity: 0;
                transform: translateX(var(--drift)) translateY(110vh) rotate(var(--rot)) scale(var(--sc));
            }
        }

        .sparkle-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff, transparent);
            box-shadow: 0 0 6px 2px var(--glow-color);
            animation: sparkleFloat var(--sp-dur) ease-in-out infinite;
            animation-delay: var(--sp-delay);
            opacity: 0;
        }

        @keyframes sparkleFloat {
            0%   { opacity: 0; transform: translateY(0) scale(0); }
            20%  { opacity: 1; transform: translateY(-20px) scale(1); }
            80%  { opacity: 0.6; transform: translateY(-60px) scale(0.8); }
            100% { opacity: 0; transform: translateY(-90px) scale(0); }
        }

        /* ========== MAIN CONTENT ========== */
        .main-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px 20px;
            text-align: center;
            width: 100%;
            max-width: 700px;
        }

        /* ========== NAME: Hải Linh ========== */
        .name-label {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(1rem, 3vw, 1.3rem);
            color: rgba(236, 72, 153, 0.7);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 8px;
            animation: fadeInDown 1s 0.3s both;
        }

        .lover-name {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(3.2rem, 10vw, 5.5rem);
            background: linear-gradient(135deg, #f472b6, #e879f9, #a78bfa, #f9a8d4);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInDown 1s 0.6s both, gradientShift 5s ease infinite;
            filter: drop-shadow(0 0 25px rgba(236, 72, 153, 0.5))
                    drop-shadow(0 0 50px rgba(167, 139, 250, 0.3));
            line-height: 1.2;
            margin-bottom: 10px;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .name-underline {
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #f472b6, #a78bfa, transparent);
            margin: 0 auto 30px;
            animation: fadeInDown 1s 0.8s both;
        }

        /* ========== HEART ========== */
        .heart-wrapper {
            position: relative;
            margin: 10px 0 25px;
            animation: fadeIn 1.2s 1s both;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.5); }
            to   { opacity: 1; transform: scale(1); }
        }

        .heart {
            width: 120px;
            height: 120px;
            position: relative;
            animation: heartbeat 1.2s ease-in-out infinite;
            transition: filter 0.3s ease;
            filter: drop-shadow(0 0 20px rgba(236, 72, 153, 0.6));
        }

        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ec4899, #f43f5e, #e879f9);
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.5);
        }

        .heart::before {
            top: -60px;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 60px;
        }

        .heart-body {
            position: absolute;
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #ec4899, #f43f5e, #e879f9);
            transform: rotate(45deg);
            top: -5px;
            left: 0;
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.5);
        }

        /* Heartbeat Animation */
        @keyframes heartbeat {
            0%   { transform: scale(1); }
            5%   { transform: scale(1.15); }
            10%  { transform: scale(1); }
            15%  { transform: scale(1.1); }
            20%  { transform: scale(1); }
            100% { transform: scale(1); }
        }

        /* Hover / Touch → glow intensely + beat faster */
        .heart-wrapper:hover .heart,
        .heart-wrapper.touching .heart {
            animation: heartbeatFast 0.5s ease-in-out infinite;
            filter: drop-shadow(0 0 40px rgba(236, 72, 153, 0.9))
                    drop-shadow(0 0 80px rgba(167, 139, 250, 0.5));
        }

        @keyframes heartbeatFast {
            0%   { transform: scale(1); }
            25%  { transform: scale(1.2); }
            50%  { transform: scale(1); }
            75%  { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Heart glow ring */
        .heart-glow-ring {
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(236, 72, 153, 0.15);
            animation: glowRingPulse 2.5s ease-in-out infinite;
            pointer-events: none;
        }

        .heart-glow-ring:nth-child(3) {
            width: 320px;
            height: 320px;
            animation-delay: 0.8s;
            border-color: rgba(167, 139, 250, 0.1);
        }

        @keyframes glowRingPulse {
            0%   { transform: translate(-50%, -50%) scale(0.8); opacity: 0.8; }
            50%  { transform: translate(-50%, -50%) scale(1.1); opacity: 0.2; }
            100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.8; }
        }

        /* ========== TYPEWRITER MESSAGE ========== */
        .typewriter-container {
            min-height: 50px;
            margin: 15px 0 35px;
            animation: fadeIn 1s 1.5s both;
        }

        .typewriter-text {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.6rem, 5vw, 2.6rem);
            color: #f9fafb;
            display: inline;
            text-shadow: 0 0 20px rgba(236, 72, 153, 0.4),
                         0 0 40px rgba(167, 139, 250, 0.2);
        }

        .typewriter-cursor {
            display: inline-block;
            width: 3px;
            height: 1.2em;
            background: #f472b6;
            margin-left: 3px;
            vertical-align: text-bottom;
            animation: cursorBlink 0.7s step-end infinite;
        }

        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0; }
        }

        /* ========== BUTTONS ========== */
        .buttons-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeIn 1s 4s both;
            position: relative;
            min-height: 70px;
            width: 100%;
            max-width: 500px;
        }

        .btn {
            padding: 14px 36px;
            border: none;
            border-radius: 50px;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* YES BUTTON */
        .btn-yes {
            background: linear-gradient(135deg, #ec4899, #a855f7);
            color: #fff;
            box-shadow: 0 4px 25px rgba(236, 72, 153, 0.4),
                        0 0 60px rgba(168, 85, 247, 0.2);
        }

        .btn-yes::before {
            background: linear-gradient(135deg, #f472b6, #c084fc);
        }

        .btn-yes:hover::before {
            opacity: 1;
        }

        .btn-yes:hover {
            transform: scale(1.08) translateY(-2px);
            box-shadow: 0 8px 40px rgba(236, 72, 153, 0.6),
                        0 0 80px rgba(168, 85, 247, 0.3);
        }

        .btn-yes:active {
            transform: scale(1.02);
        }

        /* Shine sweep effect on YES */
        .btn-yes::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.25), transparent);
            animation: shineSweep 3s ease-in-out infinite;
        }

        @keyframes shineSweep {
            0%, 100% { left: -100%; }
            50%      { left: 100%; }
        }

        /* NO BUTTON (the runaway one) */
        .btn-no {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.15s ease;
            user-select: none;
        }

        .btn-no.absolute-pos {
            position: fixed;
            z-index: 100;
        }

        /* ========== SUCCESS SCREEN ========== */
        .success-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(6, 6, 15, 0.92);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .success-overlay.visible {
            display: flex;
            opacity: 1;
        }

        .success-message {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2rem, 7vw, 3.5rem);
            background: linear-gradient(135deg, #f472b6, #e879f9, #fbbf24, #f9a8d4);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite, bounceIn 0.8s ease both;
            text-align: center;
            padding: 0 20px;
            line-height: 1.4;
            filter: drop-shadow(0 0 30px rgba(236, 72, 153, 0.6));
        }

        .success-sub {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            color: rgba(255, 255, 255, 0.8);
            margin-top: 15px;
            animation: fadeIn 1s 0.8s both;
            text-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
        }

        .success-hearts {
            font-size: 3rem;
            margin-top: 20px;
            animation: bounceIn 1s 1.2s both;
        }

        @keyframes bounceIn {
            0%   { opacity: 0; transform: scale(0.3); }
            50%  { transform: scale(1.08); }
            70%  { transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ========== FIREWORKS CANVAS ========== */
        #fireworksCanvas {
            position: fixed;
            inset: 0;
            z-index: 1001;
            pointer-events: none;
        }

        /* ========== FLOATING EMOJIS ========== */
        .floating-emoji {
            position: fixed;
            font-size: 2rem;
            animation: floatUp 4s ease-out forwards;
            pointer-events: none;
            z-index: 1002;
        }

        @keyframes floatUp {
            0%   { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
            100% { opacity: 0; transform: translateY(-300px) scale(0.5) rotate(30deg); }
        }

        /* ========== AUDIO TOGGLE ========== */
        .audio-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 500;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .audio-toggle:hover {
            background: rgba(236, 72, 153, 0.2);
            border-color: rgba(236, 72, 153, 0.4);
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 600px) {
            .main-content {
                padding: 20px 15px;
            }

            .heart {
                width: 90px;
                height: 90px;
            }

            .heart::before,
            .heart::after {
                width: 90px;
                height: 90px;
            }

            .heart::before { top: -45px; }
            .heart::after  { left: 45px; }

            .heart-body {
                width: 90px;
                height: 90px;
            }

            .heart-glow-ring {
                width: 200px;
                height: 200px;
            }

            .heart-glow-ring:nth-child(3) {
                width: 250px;
                height: 250px;
            }

            .buttons-container {
                gap: 15px;
            }

            .btn {
                padding: 12px 28px;
                font-size: 1rem;
            }
        }

        @media (max-width: 380px) {
            .heart {
                width: 70px;
                height: 70px;
            }

            .heart::before,
            .heart::after {
                width: 70px;
                height: 70px;
            }

            .heart::before { top: -35px; }
            .heart::after  { left: 35px; }

            .heart-body {
                width: 70px;
                height: 70px;
            }
        }

        /* ========== INITIAL LOADING VEIL ========== */
        .loading-veil {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #06060f;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease;
        }

        .loading-veil.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-heart-icon {
            font-size: 3rem;
            animation: heartbeat 1.2s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <!-- Loading Veil -->
    <div class="loading-veil" id="loadingVeil">
        <div class="loading-heart-icon">💖</div>
    </div>

    <!-- Cosmic Background -->
    <div class="cosmic-bg"></div>

    <!-- Stars -->
    <div class="stars-container" id="starsContainer"></div>

    <!-- Petals / Particles -->
    <div class="petals-container" id="petalsContainer"></div>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <p class="name-label">Gửi đến em</p>
        <h1 class="lover-name">Hải Linh</h1>
        <div class="name-underline"></div>

        <!-- Heart -->
        <div class="heart-wrapper" id="heartWrapper">
            <div class="heart-glow-ring"></div>
            <div class="heart-glow-ring"></div>
            <div class="heart">
                <div class="heart-body"></div>
            </div>
        </div>

        <!-- Typewriter Message -->
        <div class="typewriter-container">
            <span class="typewriter-text" id="typewriterText"></span>
            <span class="typewriter-cursor" id="typewriterCursor"></span>
        </div>

        <!-- Buttons -->
        <div class="buttons-container" id="buttonsContainer">
            <button class="btn btn-yes" id="btnYes" onclick="handleYes()">💖 Đồng ý 💖</button>
            <button class="btn btn-no" id="btnNo">Chỉ là một giấc mơ</button>
        </div>
    </main>

    <!-- Success Overlay -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-message">Anh biết em sẽ đồng ý mà! ❤️</div>
        <div class="success-sub">Từ giây phút này, anh là người hạnh phúc nhất!</div>
        <div class="success-hearts">💕🥰💕</div>
    </div>

    <!-- Fireworks Canvas -->
    <canvas id="fireworksCanvas"></canvas>

    <script>
    /* ==========================================================
       STARS
       ========================================================== */
    (function createStars() {
        const container = document.getElementById('starsContainer');
        const count = window.innerWidth < 600 ? 100 : 200;
        for (let i = 0; i < count; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 2.5 + 0.5;
            star.style.cssText = `
                width: ${size}px; height: ${size}px;
                left: ${Math.random() * 100}%;
                top: ${Math.random() * 100}%;
                --dur: ${Math.random() * 3 + 2}s;
                --o1: ${Math.random() * 0.3 + 0.1};
                --o2: ${Math.random() * 0.5 + 0.5};
                animation-delay: ${Math.random() * 5}s;
            `;
            container.appendChild(star);
        }

        // Shooting stars
        for (let i = 0; i < 3; i++) {
            const ss = document.createElement('div');
            ss.classList.add('shooting-star');
            ss.style.cssText = `
                top: ${Math.random() * 40}%;
                left: ${Math.random() * 60}%;
                animation-delay: ${i * 5 + Math.random() * 3}s;
                animation-duration: ${3 + Math.random() * 2}s;
            `;
            container.appendChild(ss);
        }
    })();

    /* ==========================================================
       PETALS & SPARKLES
       ========================================================== */
    (function createPetals() {
        const container = document.getElementById('petalsContainer');
        const petalCount = window.innerWidth < 600 ? 18 : 30;
        const petalEmojis = ['🌸', '🩷', '✨', '💫', '🩵', '💜'];

        for (let i = 0; i < petalCount; i++) {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            petal.textContent = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
            const size = Math.random() * 1.2 + 0.6;
            petal.style.cssText = `
                left: ${Math.random() * 100}%;
                font-size: ${size}rem;
                --fall-dur: ${Math.random() * 8 + 8}s;
                --delay: ${Math.random() * 10}s;
                --drift: ${(Math.random() - 0.5) * 150}px;
                --rot: ${Math.random() * 720 - 360}deg;
                --sc: ${Math.random() * 0.5 + 0.7};
            `;
            container.appendChild(petal);
        }

        // Sparkle particles
        const sparkleCount = window.innerWidth < 600 ? 12 : 20;
        const glowColors = [
            'rgba(236,72,153,0.6)', 'rgba(167,139,250,0.6)',
            'rgba(249,168,212,0.6)', 'rgba(232,121,249,0.6)',
            'rgba(244,114,182,0.5)'
        ];

        for (let i = 0; i < sparkleCount; i++) {
            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle-particle');
            sparkle.style.cssText = `
                left: ${Math.random() * 100}%;
                top: ${Math.random() * 100}%;
                --glow-color: ${glowColors[Math.floor(Math.random() * glowColors.length)]};
                --sp-dur: ${Math.random() * 3 + 2}s;
                --sp-delay: ${Math.random() * 5}s;
            `;
            container.appendChild(sparkle);
        }
    })();

    /* ==========================================================
       HEART TOUCH SUPPORT
       ========================================================== */
    const heartWrapper = document.getElementById('heartWrapper');
    heartWrapper.addEventListener('touchstart', () => heartWrapper.classList.add('touching'), { passive: true });
    heartWrapper.addEventListener('touchend', () => heartWrapper.classList.remove('touching'));

    /* ==========================================================
       TYPEWRITER EFFECT
       ========================================================== */
    (function typewriterEffect() {
        const text = 'Làm người yêu anh nhé? 💕';
        const el = document.getElementById('typewriterText');
        const cursor = document.getElementById('typewriterCursor');
        let idx = 0;
        const startDelay = 2500; // wait for name animation

        setTimeout(() => {
            const interval = setInterval(() => {
                if (idx < text.length) {
                    el.textContent += text[idx];
                    idx++;
                } else {
                    clearInterval(interval);
                    // Keep cursor blinking for a bit then hide
                    setTimeout(() => {
                        cursor.style.animationIterationCount = '6';
                    }, 3000);
                }
            }, 90);
        }, startDelay);
    })();

    /* ==========================================================
       RUNAWAY BUTTON 😄
       ========================================================== */
    const btnNo = document.getElementById('btnNo');
    let runawayCount = 0;
    const funnyTexts = [
        'Chỉ là một giấc mơ',
        'Đừng mà! 🥺',
        'Em nghĩ lại đi!',
        'Anh buồn lắm 😢',
        'Bấm "Đồng ý" đi~',
        'Không có lựa chọn này 😤',
        'Nút này hỏng rồi! 😜',
        'Thôi bấm Đồng ý đi! 💖',
    ];

    function moveButton() {
        runawayCount++;
        if (runawayCount >= funnyTexts.length) {
            runawayCount = funnyTexts.length - 1;
        }
        btnNo.textContent = funnyTexts[runawayCount];

        // Calculate safe bounds
        const bw = btnNo.offsetWidth;
        const bh = btnNo.offsetHeight;
        const maxX = window.innerWidth - bw - 20;
        const maxY = window.innerHeight - bh - 20;

        let newX = Math.random() * maxX;
        let newY = Math.random() * maxY;

        // Ensure minimum distance from edges
        newX = Math.max(10, Math.min(newX, maxX));
        newY = Math.max(10, Math.min(newY, maxY));

        // Switch to fixed positioning after first dodge
        if (!btnNo.classList.contains('absolute-pos')) {
            btnNo.classList.add('absolute-pos');
        }

        btnNo.style.left = newX + 'px';
        btnNo.style.top = newY + 'px';
    }

    // Desktop: mouseover
    btnNo.addEventListener('mouseenter', moveButton);

    // Mobile: touchstart
    btnNo.addEventListener('touchstart', (e) => {
        e.preventDefault();
        moveButton();
    }, { passive: false });

    /* ==========================================================
       YES BUTTON → FIREWORKS + SUCCESS
       ========================================================== */
    function handleYes() {
        // Hide main content smoothly
        document.getElementById('mainContent').style.transition = 'opacity 0.6s ease';
        document.getElementById('mainContent').style.opacity = '0';
        
        // Hide runaway button
        btnNo.style.display = 'none';

        setTimeout(() => {
            document.getElementById('mainContent').style.display = 'none';
            
            // Show success overlay
            const overlay = document.getElementById('successOverlay');
            overlay.style.display = 'flex';
            requestAnimationFrame(() => {
                overlay.classList.add('visible');
            });

            // Launch fireworks
            startFireworks();

            // Floating emojis
            spawnFloatingEmojis();
        }, 600);
    }

    /* ==========================================================
       FIREWORKS 🎆
       ========================================================== */
    function startFireworks() {
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        const fireworks = [];
        const particles = [];

        class Firework {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height;
                this.targetY = Math.random() * canvas.height * 0.4 + 50;
                this.speed = Math.random() * 3 + 4;
                this.trail = [];
                this.alive = true;
                this.hue = Math.random() * 60 + 300; // pink-purple range
            }
            update() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 8) this.trail.shift();
                this.y -= this.speed;
                if (this.y <= this.targetY) {
                    this.explode();
                    this.alive = false;
                }
            }
            explode() {
                const count = Math.floor(Math.random() * 40 + 60);
                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 / count) * i;
                    const speed = Math.random() * 5 + 2;
                    // Use heart-shaped explosion sometimes
                    particles.push(new Particle(this.x, this.y, angle, speed, this.hue));
                }
            }
            draw() {
                // Draw trail
                for (let i = 0; i < this.trail.length; i++) {
                    const alpha = i / this.trail.length;
                    ctx.beginPath();
                    ctx.arc(this.trail[i].x, this.trail[i].y, 2, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${alpha * 0.5})`;
                    ctx.fill();
                }
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.hue}, 100%, 80%)`;
                ctx.fill();
            }
        }

        class Particle {
            constructor(x, y, angle, speed, hue) {
                this.x = x;
                this.y = y;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.008;
                this.gravity = 0.05;
                this.hue = hue + Math.random() * 30 - 15;
                this.size = Math.random() * 2.5 + 1;
                this.trail = [];
            }
            update() {
                this.trail.push({ x: this.x, y: this.y, alpha: this.alpha });
                if (this.trail.length > 5) this.trail.shift();
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            draw() {
                // Draw trail
                for (let i = 0; i < this.trail.length; i++) {
                    const t = this.trail[i];
                    const a = (i / this.trail.length) * t.alpha * 0.3;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, this.size * 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${a})`;
                    ctx.fill();
                }
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${this.alpha})`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = `hsla(${this.hue}, 100%, 60%, ${this.alpha * 0.5})`;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        let frameCount = 0;
        let fireworkActive = true;

        function animate() {
            if (!fireworkActive) return;
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'lighter';

            frameCount++;

            // Spawn fireworks
            if (frameCount < 400 && Math.random() < 0.06) {
                fireworks.push(new Firework());
            }

            // Update & draw fireworks
            for (let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].update();
                fireworks[i].draw();
                if (!fireworks[i].alive) fireworks.splice(i, 1);
            }

            // Update & draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }

            if (frameCount > 500 && fireworks.length === 0 && particles.length === 0) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                fireworkActive = false;
                return;
            }

            requestAnimationFrame(animate);
        }

        animate();

        // Also burst a few immediately
        for (let i = 0; i < 5; i++) {
            setTimeout(() => fireworks.push(new Firework()), i * 300);
        }
    }

    /* ==========================================================
       FLOATING EMOJIS
       ========================================================== */
    function spawnFloatingEmojis() {
        const emojis = ['❤️', '💖', '💕', '🌹', '💗', '🥰', '😍', '💜', '✨', '💝'];
        let count = 0;
        const interval = setInterval(() => {
            if (count > 30) { clearInterval(interval); return; }
            const emoji = document.createElement('div');
            emoji.classList.add('floating-emoji');
            emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.left = Math.random() * 100 + '%';
            emoji.style.bottom = '-10px';
            emoji.style.fontSize = (Math.random() * 1.5 + 1.2) + 'rem';
            emoji.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(emoji);
            setTimeout(() => emoji.remove(), 5000);
            count++;
        }, 200);
    }

    /* ==========================================================
       LOADING VEIL
       ========================================================== */
    window.addEventListener('load', () => {
        setTimeout(() => {
            const veil = document.getElementById('loadingVeil');
            veil.classList.add('hidden');
            setTimeout(() => veil.remove(), 1000);
        }, 800);
    });

    /* ==========================================================
       PREVENT CONTEXT MENU ON LONG-PRESS (mobile UX)
       ========================================================== */
    document.addEventListener('contextmenu', (e) => {
        if (e.target.closest('.btn')) e.preventDefault();
    });

    </script>
